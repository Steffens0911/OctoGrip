name: Build & Publish Mobile

# Dispara com: git tag v1.2.0+9 && git push --tags
# Ou manualmente pelo botão "Run workflow" no GitHub Actions.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+\+[0-9]+'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]
      user_fraction:
        description: 'Rollout gradual em produção (0.2 = 20%; 1.0 = todos)'
        required: false
        default: '1.0'
        type: string
      platform:
        description: 'Plataformas a buildar'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, both]

jobs:
  # ─── Android ────────────────────────────────────────────────────────────────
  android:
    name: Android — App Bundle
    if: ${{ github.event_name == 'push' || inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    environment: secrets
    permissions:
      contents: read
    env:
      # Sem a conta de serviço o .aab só fica nos Artifacts (o 1º envio à Play é manual).
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - uses: actions/checkout@v4

      # O runner ubuntu-latest (Ubuntu 26) traz Java 25, que o Gradle 8.14 não suporta.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use Java 17 in Flutter
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Flutter pub get
        working-directory: viewer
        run: flutter pub get

      - name: Prepare dart defines (mobile)
        working-directory: viewer
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_APP }}
        run: python3 tool/prepare_mobile_build.py

      # Nenhuma tag com teste quebrado chega à loja.
      - name: Flutter test
        working-directory: viewer
        run: flutter test --no-pub

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > viewer/android/app/octogrip-upload.jks

      - name: Build App Bundle
        working-directory: viewer
        env:
          KEYSTORE_PATH: octogrip-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --no-pub \
            --dart-define-from-file=tool/dart_define_mobile.json

      # Sempre guarda o .aab: baixe em Actions → execução → Artifacts.
      - name: Save App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: octogrip-android-${{ github.run_number }}
          path: viewer/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Play upload skipped
        if: ${{ env.HAS_PLAY_SERVICE_ACCOUNT != 'true' }}
        run: echo "::notice::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON ausente; envie o .aab dos Artifacts à mão na Play Console."

      - name: Upload to Google Play
        if: ${{ env.HAS_PLAY_SERVICE_ACCOUNT == 'true' && (github.event.inputs.track != 'production' || github.event.inputs.user_fraction == '1.0') }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.octogrip.app
          releaseFiles: viewer/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      # Produção com rollout gradual: a Play libera só para a fração informada;
      # o aumento para 100% é feito no console depois de 2–3 dias sem erros no Sentry.
      - name: Upload to Google Play (rollout gradual)
        if: ${{ env.HAS_PLAY_SERVICE_ACCOUNT == 'true' && github.event.inputs.track == 'production' && github.event.inputs.user_fraction != '1.0' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.octogrip.app
          releaseFiles: viewer/build/app/outputs/bundle/release/app-release.aab
          track: production
          status: inProgress
          userFraction: ${{ github.event.inputs.user_fraction }}

  # ─── iOS ────────────────────────────────────────────────────────────────────
  ios:
    name: iOS — IPA
    # Em tag só roda com a variável de repositório IOS_ENABLED=true (precisa dos secrets da Apple).
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.platform != 'android') || (github.event_name == 'push' && vars.IOS_ENABLED == 'true') }}
    runs-on: macos-latest
    environment: secrets
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: viewer
        run: flutter pub get

      - name: Prepare dart defines (mobile)
        working-directory: viewer
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: python3 tool/prepare_mobile_build.py

      - name: Add GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 --decode \
            > viewer/ios/Runner/GoogleService-Info.plist

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      - name: Download provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: br.com.octogrip.app
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Build IPA
        working-directory: viewer
        run: |
          flutter build ipa --release \
            --no-pub \
            --dart-define-from-file=tool/dart_define_mobile.json \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: viewer/build/ios/ipa/OctoGrip.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
