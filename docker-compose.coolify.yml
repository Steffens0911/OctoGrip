# Stack para Coolify (e outros hosts onde o proxy gere tráfego externo).
# Igual ao docker-compose.yml, mas sem publicar portas no host — evita
# "Bind for 0.0.0.0:8080 failed: port is already allocated" quando 8080/8001/5432
# já estão em uso (ex.: Traefik/Coolify na mesma VPS).
#
# Inclui Redis + Celery (worker + beat) para reconhecimento facial em fila.
# Jobs temporários de face: FACE_JOBS_DIR dentro de api_media (mesmo volume em api e worker).
#
# No Coolify: Build Pack Docker Compose → Docker Compose Location: /docker-compose.coolify.yml
# Domínios: viewer → porta 80 no contentor; api → porta 8000 no contentor.
#
# Desenvolvimento local: continua a usar docker-compose.yml (portas 8080, 8001, 5432).

services:
  postgres:
    image: postgres:16-alpine
    container_name: jjb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jjb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD nas variaveis de ambiente do Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-jjb_db}
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 768MB
      POSTGRES_MAX_CONNECTIONS: 100
      POSTGRES_WORK_MEM: 4MB
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c max_connections=100
      -c work_mem=4MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c synchronous_commit=off
      -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jjb} -d ${POSTGRES_DB:-jjb_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jjb_redis
    restart: unless-stopped
    command: >
      redis-server --save "" --appendonly no --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/steffens0911/octogrip-api:latest
    pull_policy: always
    container_name: jjb_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop --http httptools --no-access-log
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PGSSLMODE: ${PGSSLMODE:-disable}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jjb}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jjb_db}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET nas variaveis de ambiente do Coolify}
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      ACCOUNT_LOCKOUT_ATTEMPTS: ${ACCOUNT_LOCKOUT_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_MINUTES: ${ACCOUNT_LOCKOUT_MINUTES:-15}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-12}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-6}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/secrets/firebase-service-account.json}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FACE_JOBS_DIR: ${FACE_JOBS_DIR:-/app/app_media/face_jobs}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@octogrip.com.br}
      APP_BASE_URL: ${APP_BASE_URL:-https://octogrip.com.br}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').close()"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_media:/app/app_media
      # Caminho no HOST da VPS (fora do Git) onde está o JSON; padrão /srv/octogrip/secrets
      - ${FIREBASE_SECRETS_HOST_PATH:-/srv/octogrip/secrets}:/app/secrets:ro
    mem_limit: 512m
    mem_reservation: 256m

  celery-worker-face:
    image: ghcr.io/steffens0911/octogrip-api:latest
    pull_policy: always
    container_name: jjb_celery_worker_face
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --pool=solo --concurrency=1 -Q face --hostname=worker-face@%h
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PGSSLMODE: ${PGSSLMODE:-disable}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jjb}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jjb_db}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com valor forte}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/secrets/firebase-service-account.json}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FACE_JOBS_DIR: ${FACE_JOBS_DIR:-/app/app_media/face_jobs}
      FACE_WORKER: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_media:/app/app_media
      - ${FIREBASE_SECRETS_HOST_PATH:-/srv/octogrip/secrets}:/app/secrets:ro
    mem_limit: 2g
    mem_reservation: 768m

  celery-worker-default:
    image: ghcr.io/steffens0911/octogrip-api:latest
    pull_policy: always
    container_name: jjb_celery_worker_default
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --pool=prefork --concurrency=2 -Q default --hostname=worker-default@%h
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PGSSLMODE: ${PGSSLMODE:-disable}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jjb}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jjb_db}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com valor forte}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/secrets/firebase-service-account.json}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_media:/app/app_media
      - ${FIREBASE_SECRETS_HOST_PATH:-/srv/octogrip/secrets}:/app/secrets:ro
    mem_limit: 512m
    mem_reservation: 256m

  celery-beat:
    image: ghcr.io/steffens0911/octogrip-api:latest
    pull_policy: always
    container_name: jjb_celery_beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info --schedule=/app/app_media/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PGSSLMODE: ${PGSSLMODE:-disable}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jjb}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jjb_db}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com valor forte}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FACE_JOBS_DIR: ${FACE_JOBS_DIR:-/app/app_media/face_jobs}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  viewer:
    # Imagem pré-construída pelo GitHub Actions (flutter build web roda lá,
    # onde storage.googleapis.com é acessível). Ver .github/workflows/build-viewer.yml
    image: ghcr.io/steffens0911/octogrip-viewer:latest
    pull_policy: always
    container_name: jjb_viewer
    restart: unless-stopped
    depends_on:
      - api

volumes:
  postgres_data:
  api_media:
