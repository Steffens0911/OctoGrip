# Servir o build Flutter web. Entradas sem hash no nome: forçar revalidação para o Chrome
# não ficar com bundle antigo (ícones/AppBar em falta) após novo deploy.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão: main.dart.js (~5 MB) cai para ~1.3 MB no fio.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        font/ttf
        application/octet-stream
        image/svg+xml;

    # Assets do Flutter NÃO têm hash no nome (quem versiona é o service worker):
    # cache de 1 dia + revalidação por ETag (nginx envia ETag por padrão). Sem immutable.
    location ~ ^/(assets|canvaskit|icons)/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    # Manifest: sempre fresco + MIME explícito (Chrome / critérios PWA).
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
