# Overlay de desenvolvimento — use junto com o compose principal:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up api
#
# Diferenças em relação ao perfil de produção:
#   - código montado como volume (sem rebuild a cada mudança)
#   - uvicorn com --reload (reinicia ao salvar qualquer .py)
#   - 1 worker apenas (--reload não é compatível com múltiplos workers)

services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - api_media:/app/app_media
      - face_jobs:/tmp/face_jobs
      - ./secrets:/app/secrets:ro
