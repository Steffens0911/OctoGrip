<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Ajuda alguns browsers a revalidar após deploy (o essencial são headers no nginx). -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OctoGrip — treino, academia e progresso no Jiu-Jitsu.">
  <!-- theme-color: barra do Chrome / convite PWA (alinha ao manifest.json) -->
  <meta name="theme-color" content="#D4A017">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OctoGrip">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Cropper.js — necessário para image_cropper no Flutter Web -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

  <title>OctoGrip</title>
  <link rel="manifest" href="manifest.json" crossorigin="anonymous">
</head>
<body>
  <!--
    API em Docker local (compose): host usa porta 8001 → mapa para uvicorn :8000 no contentor.
    trycloudflare.com: o Chrome bloqueia HTTPS público → 127.0.0.1; use segundo túnel na API e ?api_base=...
    Em hosts públicos não forçamos porta aqui: config_web.dart usa mesma origem (proxy) ou --dart-define.
  -->
  <script>
    // PWA install prompt — captura o evento para uso pelo Flutter.
    window.__pwaInstallPrompt = null;
    window.__pwaInstalled = false;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
    });
    window.addEventListener('appinstalled', function () {
      window.__pwaInstalled = true;
      window.__pwaInstallPrompt = null;
    });
    window.triggerPwaInstall = function () {
      var p = window.__pwaInstallPrompt;
      if (!p) return false;
      p.prompt();
      p.userChoice.then(function () {
        window.__pwaInstallPrompt = null;
      });
      return true;
    };
    window.isPwaInstalled = function () {
      if (window.__pwaInstalled) return true;
      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
      if (window.navigator && window.navigator.standalone === true) return true;
      return false;
    };
  </script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var q = params.get('api_base');
      if (q) {
        try {
          q = decodeURIComponent(q);
        } catch (e) {}
        q = String(q).trim().replace(/\/+$/, '');
        if (q) {
          sessionStorage.setItem('jjb_api_base_url', q);
        }
      }
      var stored = sessionStorage.getItem('jjb_api_base_url');
      var h = window.location.hostname;
      var viewerIsLocal = (h === 'localhost' || h === '127.0.0.1');
      function storedPointsToLoopback(s) {
        if (!s) return false;
        return /localhost/i.test(s) || /127\.0\.0\.1/.test(s);
      }
      // Páginas públicas (Coolify, sslip.io, etc.): nunca reutilizar API em loopback
      // guardada no dev — o Chrome bloqueia (Private Network Access / CORS).
      if (stored && !viewerIsLocal && storedPointsToLoopback(stored)) {
        try {
          sessionStorage.removeItem('jjb_api_base_url');
        } catch (e) {}
        stored = null;
      }
      if (stored && h.endsWith('.trycloudflare.com')) {
        if (/\.trycloudflare\.com:8000\b/.test(stored) ||
            /\.trycloudflare\.com:8001\b/.test(stored) ||
            /^https?:\/\/127\.0\.0\.1:800[01]\b/.test(stored) ||
            /^https?:\/\/localhost:800[01]\b/.test(stored)) {
          try {
            sessionStorage.removeItem('jjb_api_base_url');
          } catch (e) {}
          stored = null;
        }
      }
      if (stored) {
        window.__API_BASE_URL__ = stored;
      } else {
        if (viewerIsLocal) {
          window.__API_BASE_URL__ =
            window.location.protocol + '//' + h + ':8001';
        } else if (h.endsWith('.trycloudflare.com')) {
          window.__API_BASE_URL__ = '';
        } else {
          // Deixa vazio para config_web.dart decidir (mesma origem em produção ou :8080→:8001 na LAN).
          window.__API_BASE_URL__ = '';
        }
      }
    })();
  </script>
  <!-- Cropper.js JS — deve vir antes do Flutter bootstrap -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <!-- Atualização automática do PWA: detecta novo service worker e ativa imediatamente. -->
  <script>
    if ('serviceWorker' in navigator) {
      // Recarrega a página quando o novo service worker assumir o controle.
      var _swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (_swRefreshing) return;
        _swRefreshing = true;
        window.location.reload();
      });

      function _activateWaiting(sw) {
        // Flutter 3.x responde a { type: 'SKIP_WAITING' }
        sw.postMessage({ type: 'SKIP_WAITING' });
      }

      function _watchRegistration(registration) {
        // Já existe um SW esperando (deploy ocorreu enquanto o app estava aberto)?
        if (registration.waiting) {
          _activateWaiting(registration.waiting);
          return;
        }
        // Observa instalações futuras
        registration.addEventListener('updatefound', function () {
          var newSW = registration.installing;
          if (!newSW) return;
          newSW.addEventListener('statechange', function () {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
              _activateWaiting(newSW);
            }
          });
        });
      }

      navigator.serviceWorker.ready.then(function (registration) {
        _watchRegistration(registration);
        // Verifica atualizações a cada 5 minutos (para apps abertos por muito tempo).
        setInterval(function () {
          registration.update().then(function () {
            _watchRegistration(registration);
          });
        }, 5 * 60 * 1000);
      });
    }
  </script>
  <!-- Recuperação de tela em branco ao voltar de segundo plano.
       Flutter Web usa CanvasKit (WebGL). O browser pode descartar o contexto
       quando a aba fica inativa — tela fica em branco ao voltar.
       Solução: verifica se contexto WebGL foi perdido; recarrega só se necessário. -->
  <script>
    (function () {
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) return;
        // Verifica contexto WebGL após retornar ao primeiro plano.
        setTimeout(function () {
          var canvas = document.querySelector('canvas');
          if (!canvas) { window.location.reload(); return; }
          var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
          if (gl && gl.isContextLost()) { window.location.reload(); return; }
          window.dispatchEvent(new Event('resize'));
        }, 300);
      });

      // Safety net: perda de contexto WebGL a qualquer momento.
      document.addEventListener('webglcontextlost', function (e) {
        e.preventDefault();
        setTimeout(function () { window.location.reload(); }, 1000);
      }, false);
    })();
  </script>
  <!-- face-api.js: carregado dinamicamente só quando o quiosque facial é aberto. -->
  <script>
    // Carrega face-api.js uma única vez de forma lazy (não impacta o boot do app).
    window.__loadFaceApi = (function () {
      var _promise = null;
      return function () {
        if (_promise) return _promise;
        _promise = new Promise(function (resolve, reject) {
          if (window.faceapi) { resolve(); return; }
          var s = document.createElement('script');
          s.src = 'face-api.min.js';
          s.onload = resolve;
          s.onerror = function () { _promise = null; reject(new Error('face-api.js falhou ao carregar')); };
          document.head.appendChild(s);
        });
        return _promise;
      };
    })();

    // Wrapper de detecção facial — chamado pelo Flutter via dart:js_interop.
    window.__faceDetect = {
      _ready: false,
      _lastBox: null,   // bounding box da última face detectada {x,y,width,height}

      // Largura máxima do recorte enviado ao servidor. A face recortada em
      // resolução moderada é suficiente para o embedding e reduz upload + o
      // tempo de detecção opencv no backend (que reprocessa para alinhar).
      _maxWidth: 320,
      // Margem ao redor da face para o backend conseguir detectar/alinhar bem.
      _margin: 0.4,

      initialize: async function () {
        if (this._ready) return;
        await window.__loadFaceApi();
        await faceapi.nets.tinyFaceDetector.loadFromUri('models');
        this._ready = true;
      },

      hasFace: async function (video) {
        if (!this._ready) return false;
        try {
          var opts = new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.5, inputSize: 160 });
          var d = await faceapi.detectSingleFace(video, opts);
          this._lastBox = d ? d.box : null;
          return d != null;
        } catch (_) { this._lastBox = null; return false; }
      },

      captureJpeg: function (video) {
        try {
          var vw = video.videoWidth  || 640;
          var vh = video.videoHeight || 480;

          // Região de origem: recorte da face (com margem) ou frame inteiro.
          var sx = 0, sy = 0, sw = vw, sh = vh;
          var box = this._lastBox;
          if (box && box.width > 0 && box.height > 0) {
            var mx = box.width  * this._margin;
            var my = box.height * this._margin;
            sx = Math.max(0, box.x - mx);
            sy = Math.max(0, box.y - my);
            sw = Math.min(vw - sx, box.width  + mx * 2);
            sh = Math.min(vh - sy, box.height + my * 2);
          }

          // Redimensiona para no máximo _maxWidth de largura (mantém proporção).
          var scale = sw > this._maxWidth ? this._maxWidth / sw : 1;
          var dw = Math.max(1, Math.round(sw * scale));
          var dh = Math.max(1, Math.round(sh * scale));

          var c = document.createElement('canvas');
          c.width = dw;
          c.height = dh;
          c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, dw, dh);
          return c.toDataURL('image/jpeg', 0.85);
        } catch (_) { return null; }
      }
    };

    // Utilitários de câmera — getUserMedia encapsulado para facilitar interop Dart.
    window.__camera = {
      startCamera: async function (video, facingMode) {
        var stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode || 'user' },
          audio: false
        });
        video.srcObject = stream;
        video.autoplay  = true;
        video.muted     = true;
        video.setAttribute('playsinline', '');
        video.style.width      = '100%';
        video.style.height     = '100%';
        video.style.objectFit  = 'cover';
        await video.play();
        return stream;
      },
      stopStream: function (stream) {
        if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      }
    };
  </script>
  <!-- defer: registo do service worker mais previsível que async (critério de instalação PWA no Chrome). -->
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
