name: Build & Push Viewer

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - '.github/workflows/build-viewer.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/steffens0911/octogrip-viewer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: secrets
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: viewer
        run: flutter pub get

      - name: Prepare Firebase web config
        working-directory: viewer
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
        run: python3 tool/prepare_firebase_web_build.py

      - name: Flutter build web
        working-directory: viewer
        run: |
          flutter build web --release \
            --no-pub \
            --no-wasm-dry-run \
            --tree-shake-icons \
            --dart-define-from-file=tool/dart_define_web.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./viewer
          file: ./viewer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
