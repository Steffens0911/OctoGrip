name: Build & Push API

on:
  # Só builda após o CI (testes + lint) terminar com sucesso no main.
  # Isso garante que código quebrado nunca chegue ao Coolify.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Permite disparo manual pelo painel do GitHub Actions.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/steffens0911/octogrip-api

jobs:
  build-and-push:
    # Quando disparado por workflow_run: só continua se o CI passou.
    # Quando disparado manualmente (workflow_dispatch): sempre roda.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
