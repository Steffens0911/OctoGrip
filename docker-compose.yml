services:
  postgres:
    image: postgres:16-alpine
    container_name: jjb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jjb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jjb_secret}
      POSTGRES_DB: ${POSTGRES_DB:-jjb_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jjb} -d ${POSTGRES_DB:-jjb_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jjb_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: jjb_api
    restart: unless-stopped
    ports:
      # Host 8001 evita conflito com uvicorn local na 8000; dentro do contentor continua 8000.
      - "8001:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Cliente libpq (pg_dump/psql): em Postgres interno sem TLS, preferível a falhas de negociação SSL
      PGSSLMODE: ${PGSSLMODE:-disable}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jjb}:${POSTGRES_PASSWORD:-jjb_secret}@postgres:5432/${POSTGRES_DB:-jjb_db}
      JWT_SECRET: ${JWT_SECRET:-altere-em-producao-use-um-secret-forte}
      # JSON. Padrão [] — localhost com porta dinâmica: regex em app/main.py. ["*"] é ignorado (Flutter Web + JWT).
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      ACCOUNT_LOCKOUT_ATTEMPTS: ${ACCOUNT_LOCKOUT_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_MINUTES: ${ACCOUNT_LOCKOUT_MINUTES:-15}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-30}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-secrets/firebase-service-account.json}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FACE_JOBS_DIR: ${FACE_JOBS_DIR:-/tmp/face_jobs}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').close()"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_media:/app/app_media
      - face_jobs:/tmp/face_jobs
      # JSON da service account Firebase (mesmo caminho que FIREBASE_SERVICE_ACCOUNT_PATH no .env)
      - ./secrets:/app/secrets:ro

  celery-worker:
    build: .
    container_name: jjb_celery_worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PGSSLMODE: ${PGSSLMODE:-disable}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jjb}:${POSTGRES_PASSWORD:-jjb_secret}@postgres:5432/${POSTGRES_DB:-jjb_db}
      JWT_SECRET: ${JWT_SECRET:-altere-em-producao-use-um-secret-forte}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-secrets/firebase-service-account.json}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FACE_JOBS_DIR: ${FACE_JOBS_DIR:-/tmp/face_jobs}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_media:/app/app_media
      - face_jobs:/tmp/face_jobs
      - ./secrets:/app/secrets:ro

  celery-beat:
    build: .
    container_name: jjb_celery_beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PGSSLMODE: ${PGSSLMODE:-disable}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jjb}:${POSTGRES_PASSWORD:-jjb_secret}@postgres:5432/${POSTGRES_DB:-jjb_db}
      JWT_SECRET: ${JWT_SECRET:-altere-em-producao-use-um-secret-forte}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FACE_JOBS_DIR: ${FACE_JOBS_DIR:-/tmp/face_jobs}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8001}
        FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
        FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
        FCM_VAPID_KEY: ${FCM_VAPID_KEY:-}
    container_name: jjb_viewer
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  api_media:
  face_jobs:
